spring:
  application:
    name: ideator-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5434}/ideator_db}
    username: ${SPRING_DATASOURCE_USERNAME:ideator_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ideator_pass}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  seed:
    enabled: ${APP_SEED_ENABLED:true}

jwt:
  secret: ${JWT_SECRET:ideator-dev-secret-key-change-me-in-production-2026-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

azure:
  keyvault:
    uri: ${AZURE_KEYVAULT_URI:}
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    api-key: ${AZURE_OPENAI_KEY:}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:gpt-5-mini}
  foundry:
    project-endpoint: ${AZURE_FOUNDRY_ENDPOINT:}
    api-version: 2025-05-15-preview
    agents:
      context: ideator-context-agent
      db: ideator-db-agent
      api: ideator-api-agent
      ui: ideator-ui-agent
      security: ideator-sec-agent
      qa: ideator-qa-agent
      architecture: ideator-arch-agent
      finops: ideator-finops-agent
