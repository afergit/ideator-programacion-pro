spring:
  application:
    name: ideator-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ideator_db}
    username: ${SPRING_DATASOURCE_USERNAME:ideator_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ideator_pass}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: ${APP_SEED_ENABLED:true}

jwt:
  secret: ${JWT_SECRET:ideator-dev-secret-key-change-me-in-production-2026-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

azure:
  openai:
    endpoint: ${AZURE_OPENAI_ENDPOINT:}
    api-key: ${AZURE_OPENAI_KEY:}
    deployment: ${AZURE_OPENAI_DEPLOYMENT:gpt-4o-mini}
